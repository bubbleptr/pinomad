[package]
name = "pinomad-core"
version = "0.0.0"
edition = "2024"
license = "MIT"
description = "PiNomad client protocol core for the native apps (ADR-0024): no I/O inside, the platform layer drives it with events and executes its commands."
publish = false

[dependencies]
getrandom = "=0.4.3"
pinomad-rtc = { path = "../pinomad-rtc", optional = true }
snow = "=0.10.0"
uniffi = { version = "=0.32.2", optional = true }
url = "=2.5.8"

[dev-dependencies]
serde_json = "=1.0.149"
tungstenite = "=0.30.0"

[features]
ffi = ["dep:uniffi", "dep:pinomad-rtc"]
