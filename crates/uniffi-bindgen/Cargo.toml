[package]
name = "uniffi-bindgen"
version = "0.0.0"
edition = "2024"
license = "MIT"
description = "Workspace's pinned UniFFI binding generator — same version pin as pinomad-core's `uniffi` dependency; its own workspace so `cargo test` in the repo root never pays for bindgen deps."
publish = false

[[bin]]
name = "uniffi-bindgen"
path = "main.rs"

[dependencies]
uniffi = { version = "=0.32.2", features = ["cli"] }

# Deliberately standalone: cargo never joins this crate to the root
# workspace (root `members` lists crates/pinomad-core explicitly), and
# keeping the bindgen dep tree out of the shared Cargo.lock keeps plain
# `cargo test` builds cheap.
[workspace]
