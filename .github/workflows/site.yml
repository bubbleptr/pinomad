name: Site

# PR gate for pinomad.si (apps/site): typecheck, the install script's tests,
# and the prerendered build. The site imports the app icons from
# apps/web/public, so those trigger it too.
# Changes elsewhere in apps/web also rebuild the site through ci.yml's
# `bun run build`.
on:
  pull_request:
    paths:
      - "apps/site/**"
      - "apps/web/public/**"
      - "package.json"
      - "bun.lock"
      - "tsconfig.base.json"
      - ".github/workflows/site.yml"

permissions:
  contents: read

concurrency:
  group: site-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12
      - uses: actions/setup-node@v6
        with:
          node-version: "25"
      - run: bun install --frozen-lockfile
      - run: bunx tsc --noEmit -p apps/site
      - run: bunx vitest run --project site
      - run: bun run build
        working-directory: apps/site
