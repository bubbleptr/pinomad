name: Rust core

# PR gate for the Rust client core (ADR-0024 §12): cargo test plus the JS
# suite — `bun run test` covers both since it now shells out to cargo test.
# The macOS job (xcframework, Swift tests, simulator build) lands with the
# iOS work.
on:
  pull_request:
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "packages/protocol/**"
      - "packages/client/**"
      - "apps/host/**"
      - "apps/ios/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/rust-core.yml"

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12
      - uses: actions/setup-node@v6
        with:
          node-version: "25"
      # Reads rust-toolchain.toml for the pinned channel.
      - uses: dtolnay/rust-toolchain@stable
      - run: bun install --frozen-lockfile
      # Run from apps/web so bunx uses its locked @playwright/test; at the
      # root bunx fetches the latest playwright and installs a mismatched
      # browser build.
      - run: bunx playwright install --with-deps chromium
        working-directory: apps/web
      - run: cargo test
      - run: bun run test
