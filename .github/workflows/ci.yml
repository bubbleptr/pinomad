name: CI

# PR gate for the Bun workspace and the Rust crates: typecheck, `bun run test`
# (the vitest projects, including the web client's Playwright end-to-end tests,
# plus cargo test with and without `ffi`), then `bun run build`.
#
# It skips PRs that only touch what it doesn't exercise: docs, the site (site.yml
# checks it), the native iOS app and AgentChatKit (rust-core.yml), the server
# Dockerfile, and other workflows. Later patterns win, so ci.yml re-includes
# itself after `.github/**`. If main ever gets branch protection, don't mark
# these path-filtered checks as required: a skipped workflow never reports.
on:
  pull_request:
    paths:
      - "**"
      - "!docs/**"
      - "!**/*.md"
      - "!LICENSE"
      - "!apps/site/**"
      - "!apps/ios/**"
      - "!packages/agent-chat-kit/**"
      - "!deploy/**"
      - "!.github/**"
      - ".github/workflows/ci.yml"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12
      - uses: actions/setup-node@v6
        with:
          node-version: "25"
      # Reads rust-toolchain.toml for the pinned channel.
      - uses: dtolnay/rust-toolchain@stable
      - run: bun install --frozen-lockfile
      # Run from apps/web so bunx uses its locked @playwright/test; at the
      # root bunx fetches the latest playwright and installs a mismatched
      # browser build.
      - run: bunx playwright install --with-deps chromium
        working-directory: apps/web
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build
