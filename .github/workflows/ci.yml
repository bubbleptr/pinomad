name: CI

# PR gate for the whole repo: typecheck, `bun run test` (the vitest projects,
# including the web client's Playwright end-to-end tests, plus cargo test with
# and without `ffi`), then `bun run build`. Only doc-only changes skip it; the
# macOS iOS job stays path-filtered in rust-core.yml.
on:
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**/*.md"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12
      - uses: actions/setup-node@v6
        with:
          node-version: "25"
      # Reads rust-toolchain.toml for the pinned channel.
      - uses: dtolnay/rust-toolchain@stable
      - run: bun install --frozen-lockfile
      # Run from apps/web so bunx uses its locked @playwright/test; at the
      # root bunx fetches the latest playwright and installs a mismatched
      # browser build.
      - run: bunx playwright install --with-deps chromium
        working-directory: apps/web
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build
