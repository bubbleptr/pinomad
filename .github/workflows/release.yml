name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12
      - uses: actions/setup-node@v6
        with:
          node-version: "25"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build
      - run: bun run package -- --version "${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v0.0.0-dryrun' }}"
      - run: npm pack --pack-destination "$RUNNER_TEMP"
        working-directory: apps/cli/out
      - run: bun apps/cli/smoke.ts "$RUNNER_TEMP"/pinomad-*.tgz
      - if: startsWith(github.ref, 'refs/tags/v')
        # Prereleases (v1.2.0-beta.1) go to `next` so `pinomad upgrade` (pinomad@latest) never picks them up.
        run: npm publish --tag "${{ contains(github.ref_name, '-') && 'next' || 'latest' }}"
        working-directory: apps/cli/out
