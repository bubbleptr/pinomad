name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12
      - uses: actions/setup-node@v6
        with:
          node-version: "25"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - run: bun install --frozen-lockfile
      # Run from apps/web so bunx uses its locked @playwright/test; at the root
      # bunx fetches the latest playwright and installs a mismatched browser build.
      - run: bunx playwright install --with-deps chromium
        working-directory: apps/web
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build
      - run: bun run package -- --version "${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v0.0.0-dryrun' }}"
      - run: mkdir -p "$GITHUB_WORKSPACE/artifacts" && npm pack --pack-destination "$GITHUB_WORKSPACE/artifacts"
        working-directory: apps/cli/out
      - run: bun apps/cli/smoke.ts artifacts/pinomad-*.tgz
      - name: Upload the npm package for the publish job
        uses: actions/upload-artifact@v6
        with:
          name: npm-package
          path: artifacts/pinomad-*.tgz
          if-no-files-found: error
          retention-days: 7

  macos:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12
      - uses: actions/setup-node@v6
        with:
          node-version: "25"
          package-manager-cache: false
      - run: bun install --frozen-lockfile
      - name: Resolve version and check signing secrets
        id: meta
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          missing=()
          for name in MAC_CSC_LINK MAC_CSC_KEY_PASSWORD APPLE_API_KEY_P8 APPLE_API_KEY_ID APPLE_API_ISSUER APPLE_TEAM_ID; do
            if [ -z "${!name:-}" ]; then missing+=("$name"); fi
          done
          if ((${#missing[@]} > 0)); then
            echo "::error::Missing signing secrets: ${missing[*]} — sign and notarize cannot run."
            exit 1
          fi
          version="${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v0.0.0-dryrun' }}"
          echo "version=${version#v}" >> "$GITHUB_OUTPUT"
      - name: Build the desktop bundles
        working-directory: apps/desktop
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          # The version travels to Info.plist and the artifact names through
          # apps/desktop's package.json, not the tag.
          npm pkg set version="$VERSION"
          bun run build
      - name: Sign, notarize, and package the app
        working-directory: apps/desktop
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY }}
        run: |
          set -euo pipefail
          # The notary API key lives in a file, not an env var: write it with
          # 0600 and always clean it up below.
          export APPLE_API_KEY="$RUNNER_TEMP/pinomad-notary.p8"
          (umask 077; printf '%s' "$APPLE_API_KEY_P8" > "$APPLE_API_KEY")
          unset APPLE_API_KEY_P8
          trap 'rm -f "$APPLE_API_KEY"' EXIT
          bunx electron-builder --config electron-builder.yml --mac dmg zip --arm64 --publish never -c.forceCodeSigning=true -c.mac.notarize=true
      - name: Verify the signed app in the DMG
        env:
          DMG: apps/desktop/dist/PiNomad-${{ steps.meta.outputs.version }}-arm64.dmg
        run: |
          set -euo pipefail
          hdiutil verify "$DMG"
          mkdir -p "$RUNNER_TEMP/pinomad-dmg"
          hdiutil attach "$DMG" -readonly -nobrowse -mountpoint "$RUNNER_TEMP/pinomad-dmg"
          app="$RUNNER_TEMP/pinomad-dmg/PiNomad.app"
          test "$(lipo -archs "$app/Contents/MacOS/PiNomad")" = arm64
          codesign --verify --deep --strict --verbose=2 "$app"
          xcrun stapler validate "$app"
          spctl --assess --type execute --verbose=2 "$app"
      # desktop:e2e drives the electron-vite build via Playwright's Electron
      # driver — no browser downloads, but it does need a windowing session,
      # which the macos runner provides.
      - name: Run the desktop end-to-end suite
        run: bun run desktop:e2e
      - name: Checksums and release assets
        working-directory: apps/desktop/dist
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          shasum -a 256 "PiNomad-$VERSION-arm64.dmg" "PiNomad-$VERSION-arm64.zip" > SHA256SUMS.txt
      - name: Upload release assets
        uses: actions/upload-artifact@v6
        with:
          name: macos-arm64-release
          path: |
            apps/desktop/dist/PiNomad-${{ steps.meta.outputs.version }}-arm64.dmg
            apps/desktop/dist/PiNomad-${{ steps.meta.outputs.version }}-arm64.zip
            apps/desktop/dist/*.blockmap
            apps/desktop/dist/latest-mac.yml
            apps/desktop/dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
      - name: Clean up notarization key and mounted image
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/pinomad-notary.p8"
          if mount | grep -Fq " on $RUNNER_TEMP/pinomad-dmg "; then
            hdiutil detach "$RUNNER_TEMP/pinomad-dmg"
          fi

  publish:
    needs: [verify, macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "25"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - uses: actions/download-artifact@v6
        with:
          name: macos-arm64-release
          path: dist
        id: macos-artifact
      - uses: actions/download-artifact@v6
        with:
          name: npm-package
          path: npm-artifact
      - name: Verify downloaded assets
        working-directory: ${{ steps.macos-artifact.outputs.download-path }}
        run: sha256sum --check SHA256SUMS.txt
      - name: Publish release and npm package
        working-directory: ${{ steps.macos-artifact.outputs.download-path }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '0.0.0-dryrun' }}
          NPM_TAG: ${{ contains(github.ref_name, '-') && 'next' || 'latest' }}
          PRERELEASE: ${{ contains(github.ref_name, '-') }}
        run: |
          set -euo pipefail
          version="${VERSION#v}"
          dmg="PiNomad-$version-arm64.dmg"
          zip="PiNomad-$version-arm64.zip"
          assets=("$dmg" "$zip" "$zip.blockmap" latest-mac.yml SHA256SUMS.txt)

          # A published release cannot gain assets later; re-runs reuse a draft.
          existing=$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft' 2>/dev/null || echo missing)
          if [ "$existing" = false ]; then
            echo "::error::$RELEASE_TAG already has a published release; cut a new version instead."
            exit 1
          fi
          for asset in "${assets[@]}"; do
            if [[ ! -f $asset ]]; then echo "::error::Missing release asset: $asset"; exit 1; fi
          done
          if [ "$existing" != true ]; then
            args=(--draft --verify-tag --title "PiNomad $version" --generate-notes)
            if [ "$PRERELEASE" = true ]; then args+=(--prerelease); fi
            gh release create "$RELEASE_TAG" "${args[@]}"
          fi

          # Throttled uploads can stall; each asset retries on its own.
          for asset in "${assets[@]}"; do
            for attempt in 1 2 3; do
              if gh release upload "$RELEASE_TAG" "$asset" --clobber; then
                break
              fi
              echo "::warning::Upload of $asset failed (attempt $attempt); retrying." >&2
              [[ $attempt == 3 ]] && exit 1
            done
          done

          # The desktop update feed only goes live once the npm package is up
          # too; publish npm inside the draft window.
          # Prereleases go to `next` so `pinomad upgrade` (pinomad@latest) never picks them up.
          npm publish "$GITHUB_WORKSPACE"/npm-artifact/pinomad-*.tgz --tag "$NPM_TAG"

          latest=true
          if [ "$PRERELEASE" = true ]; then latest=false; fi
          gh release edit "$RELEASE_TAG" --draft=false --prerelease="$PRERELEASE" --latest="$latest"
          gh release view "$RELEASE_TAG" --json url --jq '"Release: " + .url' >> "$GITHUB_STEP_SUMMARY"
