# Pinned stable toolchain (ADR-0024 §12). Bump only to releases at least 7
# days old — the same freshness rule package versions follow.
[toolchain]
channel = "1.99.0"
# iOS slices of the xcframework (ADR-0024 §11): rustup installs them on
# first use on any host.
targets = ["aarch64-apple-ios", "aarch64-apple-ios-sim"]
