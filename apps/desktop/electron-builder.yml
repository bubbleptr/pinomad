appId: com.bubbleptr.pinomad
productName: PiNomad
asar: true
compression: normal
npmRebuild: false

directories:
  output: dist
  buildResources: build

# Main, preload and renderer are all bundled by electron-vite; node_modules
# never ship inside the package.
files:
  - out/**/*
  - package.json
  - "!node_modules/**/*"

# Local `bun run desktop:package` builds stay unsigned (it also sets
# CSC_IDENTITY_AUTO_DISCOVERY=false). The release workflow turns signing and
# notarization on with -c.forceCodeSigning=true -c.mac.notarize=true.
forceCodeSigning: false

artifactName: ${productName}-${version}-${arch}.${ext}

# electron-updater's app-update.yml/latest-mac.yml metadata — the CI still
# passes --publish never; uploading the files is the workflow's job.
publish:
  provider: github
  owner: bubbleptr
  repo: pinomad

# `pinomad://pair#…` deep links land on the no-host-link screen's pairing flow.
protocols:
  - name: PiNomad
    schemes:
      - pinomad

mac:
  # Icon Composer asset: electron-builder compiles .icon to Assets.car with
  # actool (Liquid Glass icon), which needs Xcode 26+.
  icon: build/icon.icon
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch:
        - arm64
    - target: zip
      arch:
        - arm64
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  minimumSystemVersion: "12.0"
