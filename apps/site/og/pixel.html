<!doctype html>
<meta charset="utf-8" />
<!-- Rendered by scripts/og.ts at 1x; out/plate.png and out/logo.png are written by the script. -->
<style>
  @font-face { font-family: "Geist Pixel"; src: url(fonts/GeistPixel-Square.woff2); }
  html, body { margin: 0; }
  .og {
    position: relative;
    width: 1200px;
    height: 630px;
    overflow: hidden;
    background: #4c9de6;
  }
  canvas {
    position: absolute;
    inset: 0;
    width: 1200px;
    height: 630px;
    image-rendering: pixelated;
  }
  .lockup {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 30px;
  }
  .lockup img {
    width: 136px;
    height: 136px;
    filter: drop-shadow(0 12px 28px rgb(0 50 110 / 0.22));
  }
  .lockup span {
    font-family: "Geist Pixel";
    font-size: 112px;
    line-height: 1;
    color: #fff;
    text-box: trim-both cap alphabetic;
    -webkit-font-smoothing: none;
  }
</style>
<div class="og">
  <canvas></canvas>
  <div class="lockup">
    <img src="out/logo.png" alt="" />
    <span>PiNomad</span>
  </div>
</div>
<script>
  // ?color=0d2b4f (hex without #)
  const color = new URLSearchParams(location.search).get("color");
  if (color) document.querySelector(".lockup span").style.color = `#${color}`;

  // 6 CSS px per dither pixel: still reads as pixels when X shrinks the card to ~500px wide.
  const CELL = 6;
  // Sky ramp sampled from the plates, dark to light.
  const ramp = ["#2481d9", "#4c9de6", "#86b9ec", "#c3d8f3", "#ffffff"].map((hex) => {
    const n = parseInt(hex.slice(1), 16);
    const rgb = [n >> 16, (n >> 8) & 255, n & 255];
    return { rgb, l: 0.2126 * rgb[0] + 0.7152 * rgb[1] + 0.0722 * rgb[2] };
  });
  const bayer = [
    0, 32, 8, 40, 2, 34, 10, 42, 48, 16, 56, 24, 50, 18, 58, 26,
    12, 44, 4, 36, 14, 46, 6, 38, 60, 28, 52, 20, 62, 30, 54, 22,
    3, 35, 11, 43, 1, 33, 9, 41, 51, 19, 59, 27, 49, 17, 57, 25,
    15, 47, 7, 39, 13, 45, 5, 37, 63, 31, 55, 23, 61, 29, 53, 21,
  ];

  const img = new Image();
  img.src = "out/plate.png";
  img.onload = () => {
    const w = Math.round(1200 / CELL);
    const h = Math.round(630 / CELL);
    const canvas = document.querySelector("canvas");
    canvas.width = w;
    canvas.height = h;
    const ctx = canvas.getContext("2d");
    ctx.drawImage(img, 0, 0, w, h);
    const data = ctx.getImageData(0, 0, w, h);
    const px = data.data;
    for (let y = 0; y < h; y++) {
      for (let x = 0; x < w; x++) {
        const i = (y * w + x) * 4;
        const l = 0.2126 * px[i] + 0.7152 * px[i + 1] + 0.0722 * px[i + 2];
        let k = 0;
        while (k < ramp.length - 2 && l > ramp[k + 1].l) k++;
        const lo = ramp[k];
        const hi = ramp[k + 1];
        const t = Math.min(1, Math.max(0, (l - lo.l) / (hi.l - lo.l)));
        const pick = t > (bayer[(y % 8) * 8 + (x % 8)] + 0.5) / 64 ? hi : lo;
        px[i] = pick.rgb[0];
        px[i + 1] = pick.rgb[1];
        px[i + 2] = pick.rgb[2];
      }
    }
    ctx.putImageData(data, 0, 0);
    document.body.dataset.ready = "1";
  };
</script>
