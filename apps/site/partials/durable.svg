<!-- One run as a track: each finished model or tool call plants a flag (a Pi
     Durable checkpoint). The markup is the finished story — a crash between two
     steps and the run resuming from the last flag — so it reads without JS;
     main.js turns it into a run the visitor can start and pull the plug on. -->
<svg class="durable-art" viewBox="0 56 960 248" aria-hidden="true" focusable="false">
  <path class="track" d="M60 180 H 900" />
  <circle class="start-cap" cx="60" cy="180" r="6" />
  <path class="trail" d="M60 180 H 900" />

  <g class="flags">
    <g class="flag" data-x="120"><path class="flag-pole" d="M120 170 V 118" /><path class="flag-cloth" d="M120 118 L 146 127 L 120 136 Z" /></g>
    <g class="flag" data-x="240"><path class="flag-pole" d="M240 170 V 118" /><path class="flag-cloth" d="M240 118 L 266 127 L 240 136 Z" /></g>
    <g class="flag" data-x="360"><path class="flag-pole" d="M360 170 V 118" /><path class="flag-cloth" d="M360 118 L 386 127 L 360 136 Z" /></g>
    <g class="flag" data-x="480"><path class="flag-pole" d="M480 170 V 118" /><path class="flag-cloth" d="M480 118 L 506 127 L 480 136 Z" /></g>
    <g class="flag" data-x="600"><path class="flag-pole" d="M600 170 V 118" /><path class="flag-cloth" d="M600 118 L 626 127 L 600 136 Z" /></g>
    <g class="flag" data-x="720"><path class="flag-pole" d="M720 170 V 118" /><path class="flag-cloth" d="M720 118 L 746 127 L 720 136 Z" /></g>
    <g class="flag" data-x="840"><path class="flag-pole" d="M840 170 V 118" /><path class="flag-cloth" d="M840 118 L 866 127 L 840 136 Z" /></g>
  </g>

  <g class="nodes">
    <circle cx="120" cy="180" r="7" />
    <circle cx="240" cy="180" r="7" />
    <circle cx="360" cy="180" r="7" />
    <circle cx="480" cy="180" r="7" />
    <circle cx="600" cy="180" r="7" />
    <circle cx="720" cy="180" r="7" />
    <circle cx="840" cy="180" r="7" />
  </g>
  <g class="finish">
    <circle cx="900" cy="180" r="12" />
    <path d="M894 180 l4.5 4.5 l8 -9" />
  </g>

  <g class="node-labels">
    <text x="120" y="214"><tspan class="zh">模型</tspan><tspan class="en">model</tspan></text>
    <text x="240" y="214">bash</text>
    <text x="360" y="214"><tspan class="zh">模型</tspan><tspan class="en">model</tspan></text>
    <text x="480" y="214">edit</text>
    <text x="600" y="214"><tspan class="zh">模型</tspan><tspan class="en">model</tspan></text>
    <text x="720" y="214">bash</text>
    <text x="840" y="214"><tspan class="zh">模型</tspan><tspan class="en">model</tspan></text>
  </g>

  <!-- Crash mark and resume arc; main.js moves them to where the plug was pulled. -->
  <g class="crash" data-crash>
    <path class="bolt" d="M668 96 L 650 134 L 662 134 L 646 172 L 682 124 L 669 124 L 682 96 Z" />
    <text class="art-note" x="664" y="80"><tspan class="zh">宿主崩溃</tspan><tspan class="en">host crashes</tspan></text>
  </g>
  <g class="resume" data-resume>
    <path class="resume-arc" data-resume-arc d="M660 232 C 652 270, 610 270, 602 236" />
    <path class="resume-head" data-resume-head d="M596 244 L 602 233 L 611 242" />
    <text class="art-note" data-resume-note x="630" y="294"><tspan class="zh">从这面旗接着跑</tspan><tspan class="en">picks up at this flag</tspan></text>
  </g>

  <g class="runner" data-runner>
    <circle class="runner-halo" cx="0" cy="180" r="15" />
    <circle class="runner-dot" cx="0" cy="180" r="8" />
  </g>
</svg>
