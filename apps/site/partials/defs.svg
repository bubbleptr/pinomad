<!-- Shared filters and symbols. Sized 0×0 rather than display:none: Firefox
     doesn't render filters defined inside a display:none SVG. -->
<svg class="svg-defs" width="0" height="0" aria-hidden="true" focusable="false">
  <defs>
    <!-- Hand-drawn strokes: two differently jittered copies of each line, like a
         pen gone over twice. Only static strokes go through it; fills are separate
         unfiltered shapes so one copy never paints over the other. -->
    <filter id="sketch" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="1" seed="3" result="n1" />
      <feDisplacementMap in="SourceGraphic" in2="n1" scale="7" xChannelSelector="R" yChannelSelector="G" result="a" />
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="11" result="n2" />
      <feDisplacementMap in="SourceGraphic" in2="n2" scale="6" xChannelSelector="G" yChannelSelector="B" result="b" />
      <feMerge>
        <feMergeNode in="a" />
        <feMergeNode in="b" />
      </feMerge>
    </filter>

    <!-- The same treatment scaled for the 32-unit icons. -->
    <filter id="sketch-sm" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.09" numOctaves="1" seed="5" result="n1" />
      <feDisplacementMap in="SourceGraphic" in2="n1" scale="1.4" xChannelSelector="R" yChannelSelector="G" result="a" />
      <feTurbulence type="fractalNoise" baseFrequency="0.14" numOctaves="1" seed="13" result="n2" />
      <feDisplacementMap in="SourceGraphic" in2="n2" scale="1.2" xChannelSelector="G" yChannelSelector="B" result="b" />
      <feMerge>
        <feMergeNode in="a" />
        <feMergeNode in="b" />
      </feMerge>
    </filter>

    <!-- The brand ghost (apps/web/public/favicon.svg paths verbatim) for the
         diagrams. Its outline width comes from --ghost-stroke on the <use>. -->
    <symbol id="ghost" viewBox="140 140 305 265">
      <path class="ghost-fill" d="M 368 244 C 384 278 372 326 348 353 C 322 382 287 398 255 396 C 234 395 221 387 228 368 C 230 362 223 365 215 366 C 185 369 165 359 159 346 C 154 337 157 337 168 335 C 197 332 211 308 221 282 C 231 254 253 244 283 233 C 318 219 350 212 362 232 Z" />
      <path class="ghost-body rough" d="M 368 244 C 384 278 372 326 348 353 C 322 382 287 398 255 396 C 234 395 221 387 228 368 C 230 362 223 365 215 366 C 185 369 165 359 159 346 C 154 337 157 337 168 335 C 197 332 211 308 221 282 C 231 254 253 244 283 233 C 318 219 350 212 362 232 Z" />
      <path class="ghost-ink" d="M 214 234 C 213 199 224 176 246 165 C 267 153 282 147 296 149 C 317 151 333 172 343 194 C 300 201 254 226 214 234 Z" />
      <path class="ghost-ink" d="M 195 239 C 229 241 262 226 306 209 C 347 193 385 177 410 185 C 437 191 438 210 425 229 C 414 244 397 257 377 267 C 373 246 365 227 350 223 C 331 217 311 226 285 236 C 255 246 238 251 227 271 C 216 291 215 305 200 312 C 172 311 153 302 149 287 C 142 264 164 244 195 239 Z" />
      <g class="eyes">
        <ellipse class="ghost-ink" cx="304" cy="272" rx="9.5" ry="15.5" />
        <ellipse class="ghost-ink" cx="343" cy="269" rx="9.5" ry="15.5" />
      </g>
    </symbol>

    <symbol id="lock" viewBox="0 0 20 22">
      <path class="lock-shackle" d="M5.5 10V7a4.5 4.5 0 0 1 9 0v3" />
      <rect class="lock-body" x="2.5" y="10" width="15" height="10" rx="2.5" />
    </symbol>
  </defs>
</svg>
