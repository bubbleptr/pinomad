name: RTCSpike
options:
  bundleIdPrefix: build.kieran.pinomad
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""

targets:
  RTCSpike:
    type: application
    platform: iOS
    sources:
      - path: RTCSpike
        excludes:
          - Info.plist
    dependencies:
      - framework: Vendor/RTCSpikeCore.xcframework
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: build.kieran.pinomad.rtcspike
        PRODUCT_NAME: RTCSpike
        INFOPLIST_FILE: RTCSpike/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        ENABLE_USER_SCRIPT_SANDBOXING: YES
    info:
      path: RTCSpike/Info.plist
      properties:
        CFBundleDisplayName: RTCSpike
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSLocalNetworkUsageDescription: "Connect to the local PiNomad RTC spike peer over UDP and HTTP."
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
