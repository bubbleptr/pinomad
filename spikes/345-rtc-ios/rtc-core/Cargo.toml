[package]
name = "rtc-spike-core"
version = "0.0.0"
edition = "2024"
license = "MIT"
description = "PiNomad #345 spike: sans-I/O STUN and str0m behind UniFFI"
publish = false

[lib]
crate-type = ["rlib"]

[dependencies]
getrandom = "=0.4.3"
pinomad-core = { path = "../../../crates/pinomad-core" }
str0m = { version = "=0.24.1", default-features = false, features = ["rust-crypto"] }
str0m-rust-crypto = "=0.6.0"
uniffi = { workspace = true, optional = true }

[features]
default = []
ffi = ["dep:uniffi"]

